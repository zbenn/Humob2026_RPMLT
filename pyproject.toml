[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humob2026-rpmlt"
version = "0.1.0"
description = "Reconstructing post-disaster mobility with local activity levels and temporal patterns"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.13,<2"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "matplotlib>=3.8,<4", "Pillow>=10"]

[project.scripts]
rpmlt = "rpmlt.cli:main"

[tool.setuptools.packages.find]
include = ["rpmlt*"]

[tool.setuptools.package-data]
rpmlt = ["assets/*.csv", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
